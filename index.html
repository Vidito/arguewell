    <script>
      const modules = [
        {
          part: 'I. Foundations',
          title: 'Argument, Argumentation, and Purpose',
          sub: 'Treat argument as both a product of reasoning and a social process of critical exchange.',
          objectives: [
            'Distinguish argument from quarrel, explanation, and persuasion',
            'Identify standpoint, reasons, audience, and dialogue goal',
          ],
          body: `
<h2>Two related meanings</h2><p>An <strong>argument</strong> is a product: one or more reasons offered to support or challenge a claim. <strong>Argumentation</strong> is a process: people advance, test, revise, defend, or withdraw standpoints in a context.</p>
<div class="callout info"><strong>Do not reduce argumentation to “winning.”</strong> A discussion can be persuasive yet unreasonable, or reasonable yet unsuccessful in changing minds. Good practice combines critical testing with fair and effective communication.</div>
<h2>What makes a passage argumentative?</h2><p>Look for a <strong>standpoint</strong> that is open to doubt and at least one reason intended to increase its acceptability. A claim without support is an assertion, not yet an argument.</p>
<div class="example"><div class="label">Worked example</div><p>“The university should extend library hours during exams because seat occupancy reaches capacity after 18:00 and many students lack quiet study space at home.”</p><ul><li><strong>Standpoint:</strong> Extend library hours during exams.</li><li><strong>Reasons:</strong> Evening demand reaches capacity; some students lack alternatives.</li><li><strong>Audience:</strong> University decision-makers.</li><li><strong>Purpose:</strong> Support a policy decision.</li></ul></div>
<h2>Argument, explanation, and persuasion</h2><div class="grid2"><div class="mini"><h4>Argument</h4><p>Answers “Why should I accept this claim?” The claim is in doubt.</p></div><div class="mini"><h4>Explanation</h4><p>Answers “Why did this happen?” The event is normally accepted as having occurred.</p></div></div><p>The same sentence can function differently depending on context. “The road is wet because it rained” may explain accepted wetness, or argue for rainfall if the rainfall is disputed.</p>
<div class="practice"><div class="label">Try it</div><p>Before evaluating a passage, write: <em>What is disputed? Who owes a reason? What outcome would count as resolution?</em></p></div>`,
          q: 'Which feature is necessary for a passage to count as an argument?',
          opts: [
            'It makes someone change their mind',
            'It contains an indicator word such as “therefore”',
            'It offers at least one reason for or against a contestable claim',
            'It uses formal logic',
          ],
          a: 2,
          why: 'An argument requires a support or attack relation between reasons and a contestable claim. Indicator words and actual persuasion are neither necessary nor sufficient.',
        },
        {
          part: 'I. Foundations',
          title: 'Claims, Premises, and Inference',
          sub: 'Reconstruct what is said, what is implied, and how the reasons are supposed to support the claim.',
          objectives: [
            'Recognize premise and conclusion indicators without relying on them mechanically',
            'Reconstruct implicit premises charitably and cautiously',
          ],
          body: `
<h2>The basic relation</h2><div class="argument">P1: Evening seat occupancy reaches capacity.<br>P2: Students need access to suitable study space.<br>C: Therefore, the university has a reason to extend library hours.</div><p>The <strong>inference</strong> is the support relation between premises and conclusion. Evaluation asks two distinct questions: Are the premises acceptable? If they are, how much support do they give the conclusion?</p>
<h2>Indicators are clues, not guarantees</h2><div class="grid2"><div class="mini"><h4>Common reason indicators</h4><p>because, since, given that, considering that</p></div><div class="mini"><h4>Common conclusion indicators</h4><p>therefore, so, thus, hence, this suggests that</p></div></div><p>Words such as <em>since</em> and <em>so</em> also have non-argumentative uses. Determine function from context.</p>
<h2>Implicit premises and enthymemes</h2><p>Everyday arguments often leave shared or obvious material unstated. An <strong>enthymeme</strong> is traditionally a rhetorical argument in which part of the reasoning is left implicit for the audience to supply. It is more precise than calling every incomplete fragment an enthymeme.</p>
<div class="example"><div class="label">Reconstruction</div><p>“Mina is a licensed electrician, so she can probably diagnose the fault.”</p><p>Possible implicit premise: “Licensed electricians normally have the relevant competence to diagnose ordinary electrical faults.” The qualifier <em>probably</em> matters. Do not reconstruct the implausibly strict claim “All electricians diagnose every fault correctly.”</p></div>
<div class="callout"><strong>Principle of charity, with limits:</strong> choose a plausible interpretation supported by wording and context. Do not invent a stronger case that the speaker could not reasonably have meant.</div>`,
          q: 'What is the best reconstruction of “He is a trained meteorologist, so his short-term forecast deserves initial credibility”?',
          opts: [
            'All meteorologists are always correct',
            'Trained meteorologists are normally competent in short-term forecasting',
            'Anyone can forecast weather',
            'The forecast must be false',
          ],
          a: 1,
          why: 'The second option supplies a qualified, relevant link without turning a defeasible appeal to expertise into an unrealistic universal claim.',
        },
        {
          part: 'I. Foundations',
          title: 'Argument Structure and Mapping',
          sub: 'See how reasons work together, independently, or in chains.',
          objectives: [
            'Distinguish linked, convergent, and serial support',
            'Create a simple argument map before evaluating',
          ],
          body: `
<h2>Three common structures</h2><table><tr><th>Structure</th><th>How it works</th><th>Diagnostic</th></tr><tr><td>Linked</td><td>Premises need one another to support the conclusion.</td><td>Remove one premise. Does the remaining reason lose most of its force?</td></tr><tr><td>Convergent</td><td>Separate reasons independently support the same conclusion.</td><td>Each reason still provides some support alone.</td></tr><tr><td>Serial</td><td>A premise supports an intermediate conclusion, which supports a further conclusion.</td><td>Look for a chain of sub-conclusions.</td></tr></table>
<div class="example"><div class="label">Map</div><div class="map"><div class="node">P1: Demand exceeds available seats after 18:00</div><div class="node">P2: Exam-period study space is an educational need</div><div class="arrow">P1 + P2 ↓ linked support</div><div class="node">IC: Current evening access is insufficient</div><div class="arrow">↓ serial support</div><div class="node">C: Extend exam-period library hours</div></div></div>
<h2>Why mapping helps</h2><p>Mapping prevents a common error: criticizing one premise as if it were the whole case. It also exposes unsupported sub-conclusions and clarifies whether a counterargument attacks evidence, inference, or the final claim.</p>`,
          q: 'Two independent studies and a separate cost analysis each support the same policy. What structure is most likely?',
          opts: ['Linked', 'Convergent', 'Circular', 'No argument'],
          a: 1,
          why: 'If each reason offers some support independently, the structure is convergent.',
        },
        {
          part: 'II. Standards',
          title: 'Deductive, Inductive, and Abductive Support',
          sub: 'Use the standard that fits the kind of support being claimed.',
          objectives: [
            'Separate validity from truth',
            'Evaluate induction and inference to the best explanation with appropriate criteria',
          ],
          body: `
<h2>Deductive support</h2><p>A deductive argument presents its conclusion as necessary if its premises are true. <strong>Validity</strong> concerns structure, not actual truth. A <strong>sound</strong> argument is valid and has true premises.</p>
<h2>Inductive support</h2><p>An inductive argument presents its conclusion as probable or well-supported rather than guaranteed. A <strong>strong</strong> inductive argument gives substantial support; a <strong>cogent</strong> one is strong and has acceptable or true premises. Terminology varies across textbooks, so state the standard you use.</p>
<h2>Abductive support</h2><p>Abduction proposes the best available explanation. Compare hypotheses using criteria such as explanatory scope, fit with evidence, simplicity, background knowledge, predictive success, and performance against alternatives.</p>
<div class="example"><div class="label">Abduction done carefully</div><p>Observation: several students cannot access the course site. Hypotheses include a server outage, expired accounts, local network failure, or user error. The best explanation is not simply the first plausible story. Check which hypothesis explains the pattern and survives testing.</p></div>
<div class="callout good"><strong>Qualifier discipline:</strong> Match language to support. Use “must” only for necessity, “probably” for strong but defeasible support, and “possibly” for mere compatibility.</div>`,
          q: 'A deductively valid argument has one false premise. What follows?',
          opts: [
            'It is sound',
            'Its conclusion must be false',
            'It is unsound, though its conclusion may still be true',
            'It becomes inductive',
          ],
          a: 2,
          why: 'Validity does not guarantee true premises. The conclusion can still happen to be true, but the argument is not sound.',
        },
        {
          part: 'II. Standards',
          title: 'Evidence, Sources, and Causal Claims',
          sub: 'Test not only whether evidence exists, but whether it is credible, relevant, and sufficient.',
          objectives: [
            'Apply credibility, relevance, and sufficiency tests',
            'Avoid common causal errors',
          ],
          body: `
<h2>Three core tests</h2><ul><li><strong>Acceptability or credibility:</strong> Is the information trustworthy and accurately represented?</li><li><strong>Relevance:</strong> Does it bear on this claim through a defensible inference?</li><li><strong>Sufficiency:</strong> Is there enough support, given the strength and consequence of the claim?</li></ul>
<h2>Source checks</h2><p>Ask about expertise, method, independence, transparency, date, directness, and agreement with the wider evidence. A source can be credible yet irrelevant, relevant yet weak, or accurate but quoted out of context.</p>
<h2>Causation needs more than sequence</h2><p>When A and B are associated, consider coincidence, reverse causation, common causes, selection effects, measurement error, and mechanisms. Strong causal cases often combine temporal order, covariation, plausible mechanism, controls, replication, and evidence against alternatives.</p>
<div class="practice"><div class="label">Causal checklist</div><ol><li>What exactly are A and B?</li><li>How were they measured?</li><li>Could B cause A?</li><li>What third factor could cause both?</li><li>Does the effect replicate, and under what conditions?</li></ol></div>`,
          q: 'A survey finds that students who use a study app have higher grades. What is the safest conclusion?',
          opts: [
            'The app definitely causes higher grades',
            'The variables are associated; motivation or prior achievement may partly explain the pattern',
            'Grades cause phones to exist',
            'The survey is useless',
          ],
          a: 1,
          why: 'Association is evidence worth investigating, but the design described does not by itself rule out confounding or reverse causation.',
        },
        {
          part: 'III. Practical Models',
          title: 'The Toulmin Layout',
          sub: 'Make the often-hidden bridge between evidence and claim visible.',
          objectives: [
            'Identify claim, grounds, warrant, backing, qualifier, and rebuttal conditions',
            'Avoid treating rebuttal as merely “the opposite opinion”',
          ],
          body: `
<h2>Six functional elements</h2><table><tr><th>Element</th><th>Question</th></tr><tr><td>Claim</td><td>What are you asking the audience to accept?</td></tr><tr><td>Grounds or data</td><td>What are you going on?</td></tr><tr><td>Warrant</td><td>Why do those grounds support this claim?</td></tr><tr><td>Backing</td><td>Why trust the warrant?</td></tr><tr><td>Qualifier</td><td>How strongly does the claim hold?</td></tr><tr><td>Rebuttal</td><td>Under what exceptional conditions would the inference not hold?</td></tr></table>
<div class="example"><div class="label">Full layout</div><p><strong>Grounds:</strong> Evening occupancy exceeded 95% on 18 of 20 exam-period weekdays.<br><strong>Claim:</strong> The university should probably extend library hours during exams.<br><strong>Warrant:</strong> When essential study capacity is predictably insufficient, extending access is an appropriate response.<br><strong>Backing:</strong> The university’s access commitments and usage records.<br><strong>Qualifier:</strong> Probably.<br><strong>Rebuttal condition:</strong> Unless staffing or safety costs are disproportionate, or equally effective lower-cost capacity is available.</p></div>
<div class="callout info">In Toulmin’s technical layout, a rebuttal is primarily a <strong>condition of exception</strong> to the qualified claim or warrant. In classroom writing, “rebuttal” is also often used more broadly for a response to a counterargument. Keep the two uses distinct.</div>`,
          q: 'Which Toulmin element answers “Why does this evidence count in favor of that claim?”',
